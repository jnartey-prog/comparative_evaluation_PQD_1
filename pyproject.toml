[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tfpq-qualifier"
version = "1.0.0"
description = "Property-specific qualification of time-frequency power-quality descriptors"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Joshua Nartey Kwedjartey"},
  {name = "Joseph Cudjoe Attachie"},
  {name = "Robert Ofosu Agyare"},
  {name = "Samuel Jonas Yeboah"},
]
dependencies = ["numpy>=2.0,<3"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Typing :: Typed", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
scientific = ["scipy>=1.14,<2", "pandas>=2.2,<3", "statsmodels>=0.14,<1", "PyWavelets>=1.7,<2", "vmdpy>=0.2,<1", "matplotlib>=3.9,<4", "pydantic>=2.8,<3", "PyYAML>=6,<7"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "hatchling>=1.25,<2"]
docs = ["sphinx>=8,<9", "myst-parser>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/tfpq_qualifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance: proposal objective acceptance tests"]

[tool.coverage.run]
source = ["tfpq_qualifier"]
branch = true

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tfpq_qualifier"]

[[tool.mypy.overrides]]
module = ["pywt", "scipy", "scipy.*", "vmdpy"]
ignore_missing_imports = true
